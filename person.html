<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Person Details | CineVerse</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2503/2503508.png">
</head>
<body>
    <!-- Back to Top Button -->
    <button id="backToTop" class="back-to-top" aria-label="Back to top">
        <i class="fas fa-arrow-up"></i>
    </button>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <i class="fas fa-film"></i>
                <span>CineVerse</span>
            </a>
            <div class="nav-search">
                <form id="searchForm">
                    <input type="text" id="searchInput" placeholder="Search movies...">
                    <button type="submit"><i class="fas fa-search"></i></button>
                </form>
            </div>
            <div class="nav-links">
                <a href="javascript:history.back()"><i class="fas fa-arrow-left"></i> Go Back</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="person-detail-page">
        <div class="container">
            <!-- Person info will be loaded here by JavaScript -->
            <div id="personContent">
                <div class="loading-detail">
                    <div class="poster-skeleton"></div>
                    <div class="info-skeleton">
                        <div class="line"></div>
                        <div class="line short"></div>
                        <div class="line"></div>
                        <div class="line"></div>
                        <div class="line short"></div>
                    </div>
                </div>
            </div>

            <!-- Filmography Section -->
            <section class="filmography-section">
                <h2><i class="fas fa-film"></i> Known For</h2>
                <div id="filmographyGrid" class="filmography-grid">
                    <!-- Will be loaded by JavaScript -->
                </div>
            </section>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <p>Powered by TMDB API • Data updates in real-time</p>
                <p class="copyright">&copy; 2024 CineVerse</p>
            </div>
        </div>
    </footer>

    <script type="module" src="script.js"></script>
    <script type="module" src="person.js"></script>
</body>

</html>
